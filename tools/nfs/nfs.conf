POOL=tank                 # TrueNAS pool name: ASSUMED, change to match
NAS_USER_PATH=/mnt/$POOL/users/$USER
NAS_MEDIA_PATH=/mnt/$POOL/media

# Client mount points, identical on macOS and Linux.
MNT_ROOT=/cellar
