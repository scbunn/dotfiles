# Shared settings for the NFS scripts (sourced by sh/bash).
NAS_HOST=cellar.distillery.taplabs.io
POOL=tank
# Per-user share: one dataset and one NFS export per user, mounted for that user only.
NAS_USER_PATH=/mnt/$POOL/users/$USER

# Client mount points, identical on macOS and Linux: /cellar/<user>
MNT_ROOT=/cellar

# uid (and primary gid) per user. These must match on TrueNAS and every client,
# because NFS sec=sys trusts the number. See docs/nfs.md.
#   scbunn  25607
#   woosuk  44809
