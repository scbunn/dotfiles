# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

# gruvbox dark; the ANSI color names are remapped so default module styles pick it up too
palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
black = '#282828'
red = '#fb4934'
green = '#b8bb26'
yellow = '#fabd2f'
blue = '#83a598'
purple = '#d3869b'
magenta = '#d3869b'
cyan = '#8ec07c'
white = '#ebdbb2'
bright-black = '#928374'
bright-red = '#fb4934'
bright-green = '#b8bb26'
bright-yellow = '#fabd2f'
bright-blue = '#83a598'
bright-purple = '#d3869b'
bright-cyan = '#8ec07c'
bright-white = '#fbf1c7'

[os]
disabled = false

[aws]
format = 'on [$symbol($profile )(\($region\) )]($style)'
style = 'bold blue'
symbol = '🅰  '

[gcloud]
symbol = '️🇬️ '
format = 'on [$symbol$account(@$domain)(\($project\))]($style) '
disabled = false


[battery]
full_symbol = '🔋 '
charging_symbol = '⚡️ '
discharging_symbol = '💀 '

[buf]
symbol = '🦬 '

[docker_context]
format = 'via [🐋 $context](blue bold)'

[golang]
format = 'via [$symbol($version )($mod_version )]($style)'

[kubernetes]
format = 'on [⛵ ($context)](dimmed green) '
disabled = false
contexts = [
  { context_pattern = "cip-(?P<team>[a-z]+)-(?P<cloud>[a-z]+)-(?P<env>[a-z]+)-(?P<region>.*)-(?P<cluster>.*)$", context_alias = "$cloud/$region/$cluster [$env] ($team)"},
  { context_pattern = "gke_.(?P<project>.*)_(?P<region>.*)_gcp-(?P<env>.*)-(?P<cregion>.*-.*)-(?P<cluster>[\\w-]+)", context_alias = "gke/$region/$cluster [$env]"},
]


[pulumi]
format = '[🛥 ($version )$stack]($style) '
