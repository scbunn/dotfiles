# ----------------------------------------------------------------------------
# Tmux Color and Style setup
# ----------------------------------------------------------------------------

# Colors: gruvbox dark
tm_color_active="#fabd2f"      # yellow
tm_color_inactive="#928374"    # gray
tm_color_feature="#d3869b"     # purple
tm_color_music="#fe8019"       # orange
tm_active_border_color="#d79921"  # faded yellow
tm_inactive_border_color="#504945" # bg2

# Separators
tm_separator_left_bold="◀"
tm_separator_left_thin="❮"
tm_separator_right_bold="▶"
tm_separator_right_thin="❯"
tm_person_icon="👤"

set -g status-left-length 32
set -g status-right-length 150
set -g status-interval 2

# Default Statusbar colors
set-option -g status-style fg=$tm_color_active,bg=default

# Default window title colors
set -g window-status-style fg=$tm_color_inactive,bg=default
set -g window-status-format "#I #W"

# active window title colors
set -g window-status-current-style fg=$tm_color_active,bg=default
set -g  window-status-current-format "$tm_separator_left_thin #I #W $tm_separator_right_thin"

# pane border
set -g pane-border-style fg=$tm_inactive_border_color
set -g pane-active-border-style fg=$tm_active_border_color

# message text
set -g message-style bg=default,fg=$tm_color_active

# pane number display
set-option -g display-panes-active-colour $tm_color_active
set-option -g display-panes-colour $tm_color_inactive

# clock
set-window-option -g clock-mode-colour $tm_color_active

tm_date="#[fg=$tm_color_inactive] %R %d %b"
tm_host="#[fg=$tm_color_feature,bold]#{@host_icon} #h"
tm_session_name="#[fg=$tm_color_feature,bold]#S"

# host icon (Nerd Font logo), chosen once when the config loads
if-shell '[ "$(uname)" = Darwin ]' 'set -g @host_icon ""' \
  'run-shell "id=$(. /etc/os-release 2>/dev/null; echo $ID); case $id in arch) i=;; debian) i=;; ubuntu) i=;; fedora) i=;; gentoo) i=;; *) i=;; esac; tmux set -g @host_icon $i"'
set -g status-left $tm_person_icon'     '
# now playing (Last.fm). direnv exec loads LASTFM_API_KEY from ~/.envrc, since
# tmux runs this outside any interactive shell.
tm_tunes="#[fg=$tm_color_music]#(direnv exec \"$HOME\" nowplaying 2>/dev/null)"

set -g status-right $tm_tunes$tm_date' '$tm_host
