# ----------------------------------------------------------------------------
# tmux default configuration
# ----------------------------------------------------------------------------

# focus events
set-option -g focus-events on

# turn on vi keybindings for copy mode
setw -g mode-keys vi


# make sure we are using 256 colors
set-option -g default-terminal "tmux-256color"
set-option -a terminal-features 'xterm-256color:RGB'


# good amount of scroll back history
set -g history-limit 20000

# rebind prefix to Ctrl-a
set -g prefix C-a
unbind C-b

# next tmux support
bind a send-prefix

# shorten command delay
set -sg escape-time 10

# bind prefix to reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "~/.config/tmux/tmux.conf reloaded."

# split wndow keybindings
bind c new-window -c "$HOME"
bind | split-window -h -c "$HOME"
bind - split-window -v -c "$HOME"

# map vi movement keys to window panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use Ctrl-h and C-l to cycle panes
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# resize panes using H,J,K,L
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# auto renumber wndows
set -g renumber-windows on

# misc bindings
unbind [
bind Escape copy-mode
unbind p
bind p paste-buffer
bind -Tcopy-mode-vi 'v' send -X begin-selection
# clipboard: OSC 52 (works over ssh) plus a local clipboard tool, so copying
# still works when the terminal ignores OSC 52 (iTerm2 does by default)
set -g set-clipboard on
if-shell 'command -v pbcopy'    'set -g copy-command pbcopy'
if-shell 'command -v wl-copy'   'set -g copy-command wl-copy'
if-shell 'command -v xclip'     'set -g copy-command "xclip -selection clipboard -in"'
if-shell 'command -v clip.exe'  'set -g copy-command clip.exe'
bind -Tcopy-mode-vi 'y' send -X copy-pipe-and-cancel

# load color and style
source-file ~/.config/tmux/theme.conf
