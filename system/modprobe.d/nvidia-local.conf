# NVIDIA suspend settings for the desktop (RTX 4090, open kernel modules, s2idle-only platform).
#
# With the open modules and NVreg_UseKernelSuspendNotifiers=1 (the default since 615.71),
# nvidia.ko saves and restores video memory by itself: no PreserveVideoMemoryAllocations=1
# and no nvidia-suspend/resume/hibernate services. Leave those services disabled.
#
# EnableS0ixPowerManagement: this box only sleeps via s2idle; lets the driver power off
#   video memory during suspend (check: /proc/driver/nvidia/gpus/0000:01:00.0/power).
# TemporaryFilePath: where video memory is saved during suspend. The open-module default is
#   tmpfs, i.e. RAM; up to 24 GB of VRAM on a 64 GB machine. /var/tmp is on disk.
#
# Install: sudo install -m 0644 -o root -g root \
#   system/modprobe.d/nvidia-local.conf /etc/modprobe.d/
# then: sudo mkinitcpio -P (nvidia is in the initramfs) and reboot.
# Check: grep -E 'S0ix|TemporaryFile' /proc/driver/nvidia/params
options nvidia NVreg_EnableS0ixPowerManagement=1 NVreg_TemporaryFilePath=/var/tmp
